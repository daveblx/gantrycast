name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and publish web bundle
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches package.json version
        run: |
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            echo "::error::Release must run from a version tag (vX.Y.Z). Current ref is '${GITHUB_REF}'. Push a tag, or re-run this workflow with the tag selected."
            exit 1
          fi

          PKG_VERSION="$(node -p "require('./package.json').version")"
          TAG_VERSION="${GITHUB_REF_NAME#v}"

          if [ "${TAG_VERSION}" != "${PKG_VERSION}" ]; then
            echo "::error::Tag '${GITHUB_REF_NAME}' does not match package.json version '${PKG_VERSION}'. Bump the version in package.json, commit, then re-tag."
            exit 1
          fi

          echo "Tag '${GITHUB_REF_NAME}' matches package.json version '${PKG_VERSION}'."

      - name: Typecheck
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Verify build output
        run: |
          for f in dist/server.js dist/index.html; do
            if [ ! -f "$f" ]; then
              echo "::error::Missing build output: $f"
              ls -la dist || true
              exit 1
            fi
          done
          echo "Build output:"
          ls -la dist

      - name: Package web bundle
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          ARCHIVE="gantrycast-${VERSION}-web.tar.gz"
          tar -czf "${ARCHIVE}" dist package.json package-lock.json
          echo "ARCHIVE=${ARCHIVE}" >> "${GITHUB_ENV}"
          ls -la "${ARCHIVE}"

      - name: Record checksum in job summary
        run: |
          {
            echo "### ${ARCHIVE} SHA-256"
            echo ""
            echo '```'
            sha256sum "${ARCHIVE}"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ARCHIVE }}
          generate_release_notes: true
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
